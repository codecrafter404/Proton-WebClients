name: Mobile Android Build

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Backend server address (e.g., 192.168.1.100:8080 or calendar.example.com)'
        required: false
        default: '10.0.2.2:8080'
        type: string
      build_variant:
        description: 'Build variant to assemble'
        required: false
        default: 'devDebug'
        type: choice
        options:
          - devDebug
          - devRelease
          - prodDebug
          - prodRelease
  push:
    branches: [main, master]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

env:
  BACKEND_URL: ${{ github.event.inputs.backend_url || '10.0.2.2:8080' }}
  BUILD_VARIANT: ${{ github.event.inputs.build_variant || 'devDebug' }}

jobs:
  build-android:
    name: Build Android Calendar APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android-calendar/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android-calendar/**/*.gradle*', 'mobile/android-calendar/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure backend server address
        working-directory: mobile/android-calendar
        run: |
          echo "# Auto-generated by CI - points Android app to custom backend" > local.properties
          echo "HOST=${{ env.BACKEND_URL }}" >> local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties
          echo ""
          echo "=== local.properties ==="
          cat local.properties
          echo ""
          echo "The Android app (dev flavor) will connect to: https://calendar-api.${{ env.BACKEND_URL }}/api"
          echo "For local development with Android emulator, use 10.0.2.2:8080"

      - name: Make gradlew executable
        working-directory: mobile/android-calendar
        run: chmod +x gradlew

      - name: Build APK (${{ env.BUILD_VARIANT }})
        working-directory: mobile/android-calendar
        run: |
          ./gradlew assemble${{ env.BUILD_VARIANT }} --no-daemon --stacktrace

      - name: Find APK files
        id: find-apk
        working-directory: mobile/android-calendar
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: proton-calendar-${{ env.BUILD_VARIANT }}
          path: mobile/android-calendar/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Build summary
        run: |
          echo "## 📱 Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Variant | \`${{ env.BUILD_VARIANT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL | \`${{ env.BACKEND_URL }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | Uploaded as artifact |" >> $GITHUB_STEP_SUMMARY

  unit-tests:
    name: Run Android Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android-calendar/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('mobile/android-calendar/**/*.gradle*', 'mobile/android-calendar/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Configure local.properties
        working-directory: mobile/android-calendar
        run: |
          echo "HOST=${{ env.BACKEND_URL }}" > local.properties
          echo "sdk.dir=$ANDROID_HOME" >> local.properties

      - name: Make gradlew executable
        working-directory: mobile/android-calendar
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: mobile/android-calendar
        run: |
          ./gradlew testDebugUnitTest testDevDebugUnitTest --no-daemon --stacktrace || true
